<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f14">

    <title>My Scooter</title>

    <!-- QR-Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080b0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "SF Pro Text", Arial, sans-serif;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 22px 18px 35px;
        }

        /* HEADER */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .scooter-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #151b23;
            border: 1px solid #252d38;

            font-size: 22px;
        }

        .brand-text {
            text-align: left;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: #707b89;
            font-size: 11px;
        }

        .connection-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;

            background: #555d68;

            box-shadow: 0 0 0 5px rgba(255,255,255,0.035);
        }

        /* MAIN SPEED CARD */

        .speed-card {
            position: relative;
            overflow: hidden;

            padding: 28px 24px 25px;

            border-radius: 27px;

            background:
                linear-gradient(145deg, #151c25, #0e1319);

            border: 1px solid #242d38;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        .speed-card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -70px;
            top: -70px;

            border-radius: 50%;

            background: rgba(255,255,255,0.025);
        }

        .speed-label {
            color: #788492;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-align: left;
        }

        .speed-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;

            margin-top: 8px;
        }

        .speed {
            font-size: 82px;
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -5px;
        }

        .speed-unit {
            color: #788492;
            font-size: 15px;
            font-weight: 700;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-top: 18px;

            padding: 8px 12px;

            border-radius: 10px;

            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.06);

            color: #8994a2;
            font-size: 12px;
            font-weight: 600;
        }

        /* BATTERY */

        .battery-section {
            margin-top: 18px;

            padding: 20px;

            border-radius: 22px;

            background: #10151b;
            border: 1px solid #202832;
        }

        .battery-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .battery-title {
            color: #778390;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.3px;
        }

        .battery-percent {
            font-size: 21px;
            font-weight: 800;
        }

        .battery-bar {
            width: 100%;
            height: 12px;

            margin-top: 15px;

            overflow: hidden;

            border-radius: 20px;

            background: #252c34;
        }

        .battery-fill {
            width: 0%;
            height: 100%;

            border-radius: 20px;

            background: #ffffff;

            transition: width 0.4s ease;
        }

        /* INFO GRID */

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

            margin-top: 18px;
        }

        .info-card {
            padding: 18px;

            min-height: 105px;

            border-radius: 20px;

            background: #10151b;
            border: 1px solid #202832;
        }

        .info-icon {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 13px;

            border-radius: 10px;

            background: #191f27;

            font-size: 16px;
        }

        .info-label {
            color: #707b89;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .info-value {
            margin-top: 5px;

            font-size: 18px;
            font-weight: 800;
        }

        /* ACTIONS */

        .actions {
            margin-top: 20px;
        }

        .action-title {
            margin-bottom: 10px;

            color: #707b89;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.3px;

            text-align: left;
        }

        button {
            width: 100%;
            height: 56px;

            margin-top: 10px;

            border: none;
            border-radius: 17px;

            font-size: 15px;
            font-weight: 750;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        button:active {
            transform: scale(0.97);
        }

        .connect {
            background: #ffffff;
            color: #080b0f;
        }

        .qr {
            background: #151b23;
            color: #ffffff;

            border: 1px solid #28313c;
        }

        .stop {
            background: #0e1217;
            color: #788492;

            border: 1px solid #202832;
        }

        /* QR */

        #qr-reader {
            display: none;

            margin-top: 15px;

            overflow: hidden;

            border-radius: 20px;

            background: #0d1116;
            border: 1px solid #252e38;
        }

        #qr-reader video {
            border-radius: 18px;
        }

        .qr-result {
            display: none;

            margin-top: 14px;
            padding: 16px;

            border-radius: 17px;

            background: #10151b;
            border: 1px solid #252e38;

            color: #9aa5b2;

            font-size: 13px;

            word-break: break-all;
        }

        .qr-result b {
            display: block;
            margin-bottom: 6px;
            color: #ffffff;
        }

        /* DEVICE */

        .device {
            display: none;

            margin-top: 15px;
            padding: 17px;

            border-radius: 17px;

            background: #10151b;
            border: 1px solid #252e38;

            text-align: left;
        }

        /* ERROR */

        .error {
            margin-top: 13px;

            color: #ff6b6b;

            font-size: 12px;
            font-weight: 600;

            line-height: 1.4;
        }

        @media (max-width: 380px) {

            .app {
                padding-left: 14px;
                padding-right: 14px;
            }

            .speed {
                font-size: 70px;
            }

            .brand-title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="scooter-icon">
                🛴
            </div>

            <div class="brand-text">

                <div class="brand-title">
                    MY SCOOTER
                </div>

                <div class="brand-subtitle">
                    Xiaomi Scooter Dashboard
                </div>

            </div>

        </div>

        <div class="connection-dot"></div>

    </div>


    <!-- SPEED -->

    <div class="speed-card">

        <div class="speed-label">
            GESCHWINDIGKEIT
        </div>

        <div class="speed-row">

            <div class="speed" id="speed">
                0.0
            </div>

            <div class="speed-unit">
                km/h
            </div>

        </div>

        <div class="status" id="status">
            ● Nicht verbunden
        </div>

    </div>


    <!-- BATTERY -->

    <div class="battery-section">

        <div class="battery-top">

            <div class="battery-title">
                AKKU
            </div>

            <div class="battery-percent" id="battery">
                -- %
            </div>

        </div>

        <div class="battery-bar">

            <div class="battery-fill" id="batteryFill"></div>

        </div>

    </div>


    <!-- INFORMATION -->

    <div class="info-grid">

        <div class="info-card">

            <div class="info-icon">
                📍
            </div>

            <div class="info-label">
                DISTANZ
            </div>

            <div class="info-value" id="distance">
                -- km
            </div>

        </div>


        <div class="info-card">

            <div class="info-icon">
                ●
            </div>

            <div class="info-label">
                STATUS
            </div>

            <div class="info-value" id="online">
                OFFLINE
            </div>

        </div>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <div class="action-title">
            SCOOTER
        </div>

        <button class="qr" onclick="startQRScanner()">
            📷 QR-Code scannen
        </button>

        <div id="qr-reader"></div>

        <div class="qr-result" id="qrResult">

            <b>Gescannte Scooter-ID:</b>

            <span id="qrText"></span>

        </div>


        <button class="connect" onclick="connectScooter()">
            🔵 Scooter verbinden
        </button>


        <button class="stop" onclick="disconnectScooter()">
            ⏹ Trennen
        </button>

    </div>


    <div class="device" id="deviceBox">

        <div id="deviceName">
            Gerät
        </div>

    </div>


    <div class="error" id="error"></div>

</div>


<script>

let bluetoothDevice = null;
let qrScanner = null;
let scooterQR = null;


/* =========================
   AKKU DESIGN AKTUALISIEREN
========================= */

function updateBattery(value) {

    const battery = document.getElementById("battery");
    const fill = document.getElementById("batteryFill");

    if (value === null || value === undefined) {

        battery.innerText = "-- %";
        fill.style.width = "0%";

        return;
    }

    battery.innerText = value + " %";

    fill.style.width = value + "%";
}


/* =========================
   QR-CODE SCANNEN
========================= */

function startQRScanner() {

    const reader = document.getElementById("qr-reader");

    reader.style.display = "block";

    if (qrScanner) {
        return;
    }

    qrScanner = new Html5Qrcode("qr-reader");

    qrScanner.start(
        { facingMode: "environment" },

        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 250
            }
        },

        function(decodedText) {

            scooterQR = decodedText;

            document.getElementById("qrText").innerText =
                decodedText;

            document.getElementById("qrResult").style.display =
                "block";

            document.getElementById("status").innerText =
                "🟢 QR-Code erkannt";

            stopQRScanner();
        },

        function(errorMessage) {
        }
    )
    .catch(function(error) {

        document.getElementById("error").innerText =
            "Kamera konnte nicht geöffnet werden: " + error;

    });
}


/* =========================
   QR SCANNER STOPPEN
========================= */

function stopQRScanner() {

    if (!qrScanner) {
        return;
    }

    qrScanner.stop()
        .then(function() {

            qrScanner.clear();

            qrScanner = null;

            document.getElementById("qr-reader").style.display =
                "none";

        })
        .catch(function(error) {

            console.log(error);

        });
}


/* =========================
   BLUETOOTH
========================= */

async function connectScooter() {

    document.getElementById("error").innerText = "";

    if (!navigator.bluetooth) {

        document.getElementById("status").innerText =
            "❌ Bluetooth nicht unterstützt";

        document.getElementById("online").innerText =
            "NICHT VERFÜGBAR";

        document.getElementById("error").innerText =
            "Dieser Browser unterstützt Web Bluetooth nicht.";

        return;
    }

    try {

        document.getElementById("status").innerText =
            "🔵 Suche nach Bluetooth-Geräten...";

        document.getElementById("online").innerText =
            "SUCHE";


        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true

            });


        const name =
            bluetoothDevice.name || "Unbekanntes Gerät";


        document.getElementById("status").innerText =
            "🟢 Gerät gefunden";

        document.getElementById("online").innerText =
            "GEFUNDEN";


        document.getElementById("deviceName").innerText =
            "🛴 " + name;


        document.getElementById("deviceBox").style.display =
            "block";


        console.log(
            "Bluetooth-Gerät:",
            bluetoothDevice
        );

        console.log(
            "QR-Code:",
            scooterQR
        );

    }

    catch (error) {

        console.log(error);

        document.getElementById("status").innerText =
            "❌ Verbindung abgebrochen";

        document.getElementById("online").innerText =
            "OFFLINE";

        document.getElementById("error").innerText =
            error.message ||
            "Bluetooth-Verbindung fehlgeschlagen.";

    }
}


/* =========================
   TRENNEN
========================= */

function disconnectScooter() {

    if (bluetoothDevice) {

        bluetoothDevice = null;

    }


    document.getElementById("status").innerText =
        "● Nicht verbunden";

    document.getElementById("online").innerText =
        "OFFLINE";

    document.getElementById("deviceBox").style.display =
        "none";

    document.getElementById("error").innerText =
        "";

    updateBattery(null);

    document.getElementById("speed").innerText =
        "0.0";

    document.getElementById("distance").innerText =
        "-- km";
}

</script>

</body>
</html>
